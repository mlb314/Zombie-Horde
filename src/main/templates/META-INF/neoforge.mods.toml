authors="${mod_authors}"
#displayURL="https://github.com/YourName/zombie-horde" #optional
description='''
Zombies spawn more often, and every naturally spawned zombie arrives with a few extras.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
